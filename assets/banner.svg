  <g transform="translate(1010 150)" fill="none" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="2">
    <rect x="0" y="0" width="184" height="120" rx="10"/>
    <line x1="0" y1="34" x2="184" y2="34"/>
    <circle cx="20" cy="17" r="5" fill="#2dd4bf" stroke="none"/>
    <circle cx="40" cy="17" r="5" fill="#30363d" stroke="none"/>
    <circle cx="60" cy="17" r="5" fill="#30363d" stroke="none"/>
    <line x1="22" y1="62" x2="120" y2="62" stroke="#7d8590"/>
