<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.30" r="0.9">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="20" fill="url(#dots)"/>
  <rect width="1280" height="640" rx="20" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="638" rx="19" fill="none" stroke="#1f2937" stroke-width="2"/>

  <text x="96" y="150" fill="#7d8590" font-size="22" letter-spacing="7" font-weight="600">PROJECT SCAFFOLD FOR CLAUDE CODE</text>

  <text x="93" y="300" font-size="132" font-weight="700" letter-spacing="-3">
    <tspan fill="#e6edf3">bobi</tspan><tspan fill="#2dd4bf">-stack</tspan>
  </text>
  <rect x="775" y="208" width="26" height="104" fill="#2dd4bf"/>

  <text x="96" y="372" fill="#c9d1d9" font-size="34" font-weight="500">Next.js + Supabase + TanStack Query, wired and ready.</text>
