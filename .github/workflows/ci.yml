name: CI

# Lean correctness gate. Runs the same ops.sh verbs you run locally,
# so CI and local never disagree. Generated to the /cicd skill spec,
# adapted for this template's pnpm + ops.sh setup.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint + typecheck
        run: bash ops.sh check

      - name: Test (data-layer registry config)
        run: bash ops.sh test

      - name: Build
        run: bash ops.sh build
