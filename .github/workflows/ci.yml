name: CI

# Lean correctness gate. Runs the same ops.sh verbs you run locally,
# so CI and local never disagree. Generated to the /cicd skill spec,
# adapted for this template's pnpm + ops.sh setup.
#
# The bare template has no pnpm-lock.yaml. Until a project is filled
# in and dependencies are installed, the guard step skips the real
# work and the job passes, so an unfilled template (or a freshly
# generated repo) does not spam failure emails. Once pnpm-lock.yaml
# exists, the full gate runs.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect filled-in project
        id: guard
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pnpm-lock.yaml found. This looks like the unfilled bobi-stack template, so CI is skipped. It runs in full once the project is filled in and dependencies are installed."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.proceed == 'true'
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.proceed == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        if: steps.guard.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint + typecheck
        if: steps.guard.outputs.proceed == 'true'
        run: bash ops.sh check

      - name: Test (data-layer registry config)
        if: steps.guard.outputs.proceed == 'true'
        run: bash ops.sh test

      - name: Build
        if: steps.guard.outputs.proceed == 'true'
        run: bash ops.sh build
