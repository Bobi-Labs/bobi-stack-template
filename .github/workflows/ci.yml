name: CI

# Lean correctness gate. Runs the same ops.sh verbs you run locally,
# so CI and local never disagree. Generated to the /cicd skill spec,
# adapted for this template's pnpm + ops.sh setup.
#
# The guard skips the real work when there is no pnpm-lock.yaml, so a
# repo generated without its lockfile does not spam failure emails.
# The template itself ships a lockfile, so the full gate runs here too.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect filled-in project
        id: guard
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pnpm-lock.yaml found. This looks like the unfilled bobi-stack template, so CI is skipped. It runs in full once the project is filled in and dependencies are installed."
          fi

      # No version here on purpose: action-setup reads package.json's
      # packageManager, so bumping pnpm is a one-file change. A second pin
      # here fails the job with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4.1.0
        if: steps.guard.outputs.proceed == 'true'

      - uses: actions/setup-node@v5
        if: steps.guard.outputs.proceed == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        if: steps.guard.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint + typecheck
        if: steps.guard.outputs.proceed == 'true'
        run: bash ops.sh check

      - name: Test (data-layer registry config)
        if: steps.guard.outputs.proceed == 'true'
        run: bash ops.sh test

      # Fails the build on the greppable half of
      # docs/recipes/security-and-failure-modes.md. These checks exist
      # because each one already happened in production somewhere.
      - name: Security + failure-mode audit
        if: steps.guard.outputs.proceed == 'true'
        run: bash ops.sh audit-security --strict

      - name: Build
        if: steps.guard.outputs.proceed == 'true'
        run: bash ops.sh build
